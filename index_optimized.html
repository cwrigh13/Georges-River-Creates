<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georges River Creates</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Work Sans', sans-serif;
            background-color: #f7fafc;
        }
        /* Custom scrollbar for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a0aec0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
        .hidden-sub-nav {
            display: none !important;
        }
        /* Hanging indent for bullet points: second line aligns with first line's text after bullet */
        ul.list-disc li {
            padding-left: 1.5em;
            text-indent: -1.5em;
        }
        ul.list-disc li::marker {
            font-size: 1em;
        }
        
        /* Image Modal Styles */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
            text-align: center;
        }
        
        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
        
        .close-modal:hover,
        .close-modal:focus {
            color: #bbb;
            text-decoration: none;
        }
        
        .clickable-image {
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }
        
        .clickable-image:hover {
            transform: scale(1.02);
        }

        /* Loading indicator */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0d9488;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content">
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>
    
    <!-- Report Issue Modal -->
    <div id="reportIssueModal" class="image-modal">
        <span class="close-modal" onclick="closeReportIssueModal()">&times;</span>
        <div class="modal-content bg-white rounded-lg p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold text-teal-700 mb-4">Report an Issue</h2>
            <form id="reportIssueForm" class="space-y-4">
                <div>
                    <label for="userName" class="block text-sm font-medium text-gray-700 mb-1">Your Name *</label>
                    <input type="text" id="userName" name="userName" required 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="userEmail" class="block text-sm font-medium text-gray-700 mb-1">Your Email *</label>
                    <input type="email" id="userEmail" name="userEmail" required 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="issueDescription" class="block text-sm font-medium text-gray-700 mb-1">Describe the Problem *</label>
                    <textarea id="issueDescription" name="issueDescription" rows="4" required 
                              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent resize-none"></textarea>
                </div>
                <input type="hidden" id="issuePage" name="issuePage" value="">
                <input type="hidden" id="issueItem" name="issueItem" value="">
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeReportIssueModal()" 
                            class="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors duration-200">
                        Cancel
                    </button>
                    <button type="submit" 
                            class="flex-1 px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors duration-200">
                        Submit Report
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-4 w-full">
            <img src="https://georgesriver.spydus.com/api/maintenance/1.0/imagebrowser/image?blobName=a31cf63f-7e24-41d5-b1f8-c206bde45ce6.png" 
                 alt="Georges River Libraries Logo" class="h-12 w-auto">
            <div class="flex-1">
                <h1 class="text-2xl font-bold">Georges River Creates</h1>
                <p class="text-teal-100 text-sm">Digital Tool Library & Creative Spaces</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex">
        <!-- Sidebar Navigation -->
        <nav class="w-64 bg-white shadow-lg p-4 overflow-y-auto custom-scrollbar">
            <div class="space-y-2">
                <div class="mb-6">
                    <button id="gettingStartedMainBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">Getting Started</button>
                    <div id="gettingStartedSubNav" class="hidden-sub-nav flex flex-col space-y-2 mt-2 pl-4">
                        <button id="askMeAnythingBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Ask Me Anything</button>
                        <button id="introBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Introduction</button>
                        <button id="faqsBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">FAQs</button>
                        <div id="faqsSubNav" class="hidden-sub-nav flex flex-col space-y-2 mt-2 pl-4">
                            <button id="faqsDtlBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Digital Tool Library</button>
                            <button id="faqsMiBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Musical Instrument Collection</button>
                            <button id="faqsMediaLabBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Media Lab</button>
                            <button id="faqsSoundBoothBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Sound Booth</button>
                            <button id="faqsInHouseBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">In-House Packs</button>
                        </div>
                        <button id="bookingsFeesBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Bookings and Fees</button>
                        <button id="termsConditionsMainSubBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Terms & Conditions</button>
                        <div id="termsConditionsSubNav" class="hidden-sub-nav flex flex-col space-y-2 mt-2 pl-4">
                            <button id="termsMediaLabBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Media Lab</button>
                            <button id="termsSoundBoothBtn" class="flex-1 py-2 px-3 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Sound Booth</button>
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <button id="loanableItemsMainBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">Loanable Items</button>
                    <div id="loanableItemsSubNav" class="hidden-sub-nav flex flex-col space-y-2 mt-2 pl-4">
                        <button id="loanableDtlBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Digital Tool Library</button>
                        <button id="loanableMiBtn" class="flex-1 py-2 px-3 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-sm hover:bg-gray-300 w-full text-left">Musical Instrument Collection</button>
                    </div>
                </div>
                
                <div class="mb-6">
                    <button id="inHouseItemsBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">In-House Items</button>
                </div>
                
                <div class="mb-6">
                    <button id="permanentEquipmentBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">Permanent Equipment</button>
                </div>
                
                <div class="mb-6">
                    <button id="spacesBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">Spaces</button>
                </div>
                
                <div class="mb-6">
                    <button id="eventsBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">Events</button>
                </div>
                
                <div class="mb-6">
                    <button id="settingsBtn" class="flex-1 py-3 px-4 rounded-lg font-medium text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all duration-200 bg-gray-200 text-gray-800 shadow-md hover:bg-gray-300 w-full text-center">Settings</button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 overflow-y-auto custom-scrollbar">
            <!-- Search Bar -->
            <div class="mb-6">
                <div class="relative">
                    <input type="text" id="searchBar" placeholder="Search items, spaces, or events..." 
                           class="w-full p-4 pl-12 pr-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent text-lg">
                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- List View -->
            <div id="listView" class="mb-6">
                <!-- List items will be dynamically loaded here -->
            </div>

            <!-- Detail View -->
            <div id="detailView">
                <div class="loading">
                    <div class="spinner"></div>
                    <span class="ml-3 text-gray-600">Loading data...</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Global variables
        let mockData = {};
        let isGlobalSearchActive = false;
        let currentSection = '';
        let currentSubSection = '';

        // DOM elements
        let searchBar, listView, detailView;
        let gettingStartedMainBtn, loanableItemsMainBtn, inHouseItemsBtn, permanentEquipmentBtn, spacesBtn, eventsBtn, settingsBtn;
        let gettingStartedSubNav, askMeAnythingBtn, introBtn, faqsBtn, bookingsFeesBtn, termsConditionsMainSubBtn;
        let loanableItemsSubNav, loanableDtlBtn, loanableMiBtn;

        // Load data from JSON files
        async function loadData() {
            try {
                const categories = ['gettingStarted', 'loanableItems', 'inHouseItems', 'permanentEquipment', 'spaces', 'events'];
                
                for (const category of categories) {
                    const response = await fetch(`data/${category}.json`);
                    if (response.ok) {
                        mockData[category] = await response.json();
                        console.log(`Loaded ${category}:`, mockData[category].length, 'items');
                    } else {
                        console.error(`Failed to load ${category}.json`);
                        mockData[category] = [];
                    }
                }
                
                console.log('All data loaded successfully');
                initializeApp();
            } catch (error) {
                console.error('Error loading data:', error);
                showError('Failed to load data. Please refresh the page.');
            }
        }

        // Initialize the application
        function initializeApp() {
            initializeDOM();
            initializeEventListeners();
            
            // Show default content
            navigateToSection('gs-ask-me-anything', 'gettingStartedMainBtn');
        }

        // Initialize DOM elements
        function initializeDOM() {
            // Main elements
            searchBar = document.getElementById('searchBar');
            listView = document.getElementById('listView');
            detailView = document.getElementById('detailView');
            
            // Navigation buttons
            gettingStartedMainBtn = document.getElementById('gettingStartedMainBtn');
            loanableItemsMainBtn = document.getElementById('loanableItemsMainBtn');
            inHouseItemsBtn = document.getElementById('inHouseItemsBtn');
            permanentEquipmentBtn = document.getElementById('permanentEquipmentBtn');
            spacesBtn = document.getElementById('spacesBtn');
            eventsBtn = document.getElementById('eventsBtn');
            settingsBtn = document.getElementById('settingsBtn');
            
            // Sub-navigation
            gettingStartedSubNav = document.getElementById('gettingStartedSubNav');
            askMeAnythingBtn = document.getElementById('askMeAnythingBtn');
            introBtn = document.getElementById('introBtn');
            faqsBtn = document.getElementById('faqsBtn');
            bookingsFeesBtn = document.getElementById('bookingsFeesBtn');
            termsConditionsMainSubBtn = document.getElementById('termsConditionsMainSubBtn');
            
            loanableItemsSubNav = document.getElementById('loanableItemsSubNav');
            loanableDtlBtn = document.getElementById('loanableDtlBtn');
            loanableMiBtn = document.getElementById('loanableMiBtn');
        }

        // Initialize event listeners
        function initializeEventListeners() {
            // Search functionality
            searchBar.addEventListener('input', handleSearch);
            
            // Main navigation
            gettingStartedMainBtn.addEventListener('click', () => {
                hideAllSubNavs();
                gettingStartedSubNav.classList.remove('hidden-sub-nav');
                navigateToSection('gs-ask-me-anything', 'gettingStartedMainBtn');
            });
            
            loanableItemsMainBtn.addEventListener('click', () => {
                hideAllSubNavs();
                loanableItemsSubNav.classList.remove('hidden-sub-nav');
                navigateToSection('loanable-dtl', 'loanableItemsMainBtn');
            });
            
            inHouseItemsBtn.addEventListener('click', () => {
                hideAllSubNavs();
                navigateToSection('inHouseItems', 'inHouseItemsBtn');
            });
            
            permanentEquipmentBtn.addEventListener('click', () => {
                hideAllSubNavs();
                navigateToSection('permanentEquipment', 'permanentEquipmentBtn');
            });
            
            spacesBtn.addEventListener('click', () => {
                hideAllSubNavs();
                navigateToSection('spaces', 'spacesBtn');
            });
            
            eventsBtn.addEventListener('click', () => {
                hideAllSubNavs();
                navigateToSection('events', 'eventsBtn');
            });
            
            // Sub-navigation
            askMeAnythingBtn.addEventListener('click', () => navigateToSection('gs-ask-me-anything', 'askMeAnythingBtn'));
            introBtn.addEventListener('click', () => navigateToSection('gs-intro', 'introBtn'));
            faqsBtn.addEventListener('click', () => navigateToSection('gs-faqs', 'faqsBtn'));
            bookingsFeesBtn.addEventListener('click', () => navigateToSection('gs-bookings-fees', 'bookingsFeesBtn'));
            termsConditionsMainSubBtn.addEventListener('click', () => navigateToSection('gs-terms', 'termsConditionsMainSubBtn'));
            
            loanableDtlBtn.addEventListener('click', () => navigateToSection('loanable-dtl', 'loanableDtlBtn'));
            loanableMiBtn.addEventListener('click', () => navigateToSection('loanable-mi', 'loanableMiBtn'));
        }

        // Hide all sub-navigation menus
        function hideAllSubNavs() {
            const subNavs = document.querySelectorAll('.hidden-sub-nav');
            subNavs.forEach(nav => nav.classList.add('hidden-sub-nav'));
        }

        // Navigate to a specific section
        function navigateToSection(sectionId, buttonId) {
            currentSection = sectionId;
            isGlobalSearchActive = false;
            
            // Clear search
            searchBar.value = '';
            
            // Update active button
            updateActiveButton(buttonId);
            
            // Show appropriate content
            if (sectionId.startsWith('gs-')) {
                showGettingStartedContent(sectionId);
            } else if (sectionId === 'loanable-dtl' || sectionId === 'loanable-mi') {
                showLoanableItemsList(sectionId);
            } else if (sectionId === 'inHouseItems') {
                showInHouseItemsList();
            } else if (sectionId === 'permanentEquipment') {
                showPermanentEquipmentList();
            } else if (sectionId === 'spaces') {
                showSpacesList();
            } else if (sectionId === 'events') {
                showEventsList();
            }
        }

        // Update active button styling
        function updateActiveButton(buttonId) {
            // Remove active styling from all buttons
            const allButtons = document.querySelectorAll('button');
            allButtons.forEach(btn => {
                btn.classList.remove('bg-teal-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-800');
            });
            
            // Add active styling to current button
            const activeButton = document.getElementById(buttonId);
            if (activeButton) {
                activeButton.classList.remove('bg-gray-200', 'text-gray-800');
                activeButton.classList.add('bg-teal-600', 'text-white');
            }
        }

        // Show getting started content
        function showGettingStartedContent(sectionId) {
            const entry = mockData.gettingStarted.find(item => item.id === sectionId);
            
            if (entry) {
                detailView.innerHTML = `
                    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8 lg:p-10 border border-gray-200">
                        <header class="mb-6 border-b pb-4 border-gray-200">
                            <h1 class="text-3xl md:text-4xl font-bold text-teal-700 mb-2">${entry.name}</h1>
                            <p class="text-gray-600 text-lg">${entry.description}</p>
                        </header>
                        <section class="prose prose-lg max-w-none">
                            ${entry.fullDescription}
                        </section>
                    </div>
                `;
                listView.innerHTML = '';
            }
        }

        // Show loanable items list
        function showLoanableItemsList(sectionId) {
            let items, listTitle;
            
            if (sectionId === 'loanable-dtl') {
                items = mockData.loanableItems.filter(item => item.category === 'Digital Tool Library');
                listTitle = 'Digital Tool Library';
            } else if (sectionId === 'loanable-mi') {
                items = mockData.loanableItems.filter(item => item.category === 'Musical Instrument Collection');
                listTitle = 'Musical Instrument Collection';
            }
            
            if (items && items.length > 0) {
                const listHtml = generateListHtml(items, listTitle);
                detailView.innerHTML = listHtml;
                listView.innerHTML = '';
            }
        }

        // Show in-house items list
        function showInHouseItemsList() {
            const items = mockData.inHouseItems || [];
            const listHtml = generateListHtml(items, 'In-House Items');
            detailView.innerHTML = listHtml;
            listView.innerHTML = '';
        }

        // Show permanent equipment list
        function showPermanentEquipmentList() {
            const items = mockData.permanentEquipment || [];
            const listHtml = generateListHtml(items, 'Permanent Equipment');
            detailView.innerHTML = listHtml;
            listView.innerHTML = '';
        }

        // Show spaces list
        function showSpacesList() {
            const items = mockData.spaces || [];
            const listHtml = generateListHtml(items, 'Spaces');
            detailView.innerHTML = listHtml;
            listView.innerHTML = '';
        }

        // Show events list
        function showEventsList() {
            const items = mockData.events || [];
            const listHtml = generateListHtml(items, 'Events');
            detailView.innerHTML = listHtml;
            listView.innerHTML = '';
        }

        // Generate list HTML
        function generateListHtml(items, title) {
            if (!items || items.length === 0) {
                return `
                    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8 lg:p-10 border border-gray-200">
                        <h1 class="text-3xl md:text-4xl font-bold text-teal-700 mb-6">${title}</h1>
                        <p class="text-gray-600">No items available at the moment.</p>
                    </div>
                `;
            }

            const itemsHtml = items.map(item => `
                <div class="bg-white rounded-lg shadow-md p-6 border border-gray-200 hover:shadow-lg transition-shadow duration-200">
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">${item.name}</h3>
                    <p class="text-gray-600 mb-4">${item.description}</p>
                    <div class="flex flex-wrap gap-2">
                        ${item.category ? `<span class="px-3 py-1 bg-teal-100 text-teal-800 rounded-full text-sm">${item.category}</span>` : ''}
                        ${item.location ? `<span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">${item.location}</span>` : ''}
                    </div>
                </div>
            `).join('');

            return `
                <div class="max-w-4xl w-full">
                    <h1 class="text-3xl md:text-4xl font-bold text-teal-700 mb-6">${title}</h1>
                    <div class="grid gap-6">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        }

        // Handle search
        function handleSearch(event) {
            const query = event.target.value.trim();
            
            if (query.length < 2) {
                if (isGlobalSearchActive) {
                    // Return to previous section
                    navigateToSection(currentSection, '');
                }
                return;
            }
            
            performSearch(query);
        }

        // Perform search
        function performSearch(query) {
            isGlobalSearchActive = true;
            const searchResults = [];
            const searchTerm = query.toLowerCase();
            
            // Search through all data sources
            const allItems = [
                ...(mockData.gettingStarted || []),
                ...(mockData.loanableItems || []),
                ...(mockData.inHouseItems || []),
                ...(mockData.permanentEquipment || []),
                ...(mockData.spaces || []),
                ...(mockData.events || [])
            ];
            
            allItems.forEach(item => {
                const searchableText = `${item.name} ${item.description} ${item.fullDescription || ''} ${item.accessionNo || ''}`.toLowerCase();
                if (searchableText.includes(searchTerm)) {
                    searchResults.push(item);
                }
            });
            
            if (searchResults.length > 0) {
                const listHtml = generateListHtml(searchResults, `Search Results for "${query}"`);
                detailView.innerHTML = listHtml;
                listView.innerHTML = '';
            } else {
                detailView.innerHTML = `
                    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8 lg:p-10 border border-gray-200">
                        <h1 class="text-3xl md:text-4xl font-bold text-teal-700 mb-2">No Results Found</h1>
                        <p class="text-gray-700 leading-relaxed">
                            No items found matching "${query}". Try searching with different keywords or browse the categories using the navigation menu.
                        </p>
                    </div>
                `;
                listView.innerHTML = '';
            }
        }

        // Show error message
        function showError(message) {
            detailView.innerHTML = `
                <div class="max-w-4xl w-full bg-red-50 rounded-xl shadow-lg p-6 md:p-8 lg:p-10 border border-red-200">
                    <h1 class="text-3xl md:text-4xl font-bold text-red-700 mb-2">Error</h1>
                    <p class="text-red-600 leading-relaxed">${message}</p>
                </div>
            `;
        }

        // Start the application
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
